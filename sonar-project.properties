# The project key is passed by .github/workflows/sonarqube.yml.

# Convex regenerates these files on every `convex dev`/`convex deploy`;
# findings in them cannot be fixed in source.
sonar.exclusions=frontend/convex/_generated/**
# Test fixtures intentionally repeat request and Convex setup patterns; do not
# treat that duplication as production-code duplication on new PRs. Lockfiles
# and Dockerfiles also repeat generated or pinned declarations because each
# package/image is isolated.
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts,**/tests/**,**/*lock.yaml,**/*lock.yml,**/pnpm-lock.yaml,**/pnpm-workspace.yaml,**/package.json,**/package-lock.json,**/Dockerfile,**/.github/workflows/**,**/.forgejo/workflows/**
