# The project key is passed by .github/workflows/sonarqube.yml.

# Test fixtures intentionally repeat request setup patterns; do not
# treat that duplication as production-code duplication on new PRs. The
# attribution catalog repeats typed fields by design, and lockfiles and
# Dockerfiles repeat generated or pinned declarations because each package or
# image is isolated.
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts,**/tests/**,**/*lock.yaml,**/*lock.yml,**/pnpm-lock.yaml,**/pnpm-workspace.yaml,**/package.json,**/package-lock.json,**/Dockerfile,**/.github/workflows/**,**/.forgejo/workflows/**,frontend/lib/color-extraction/server-extraction.ts,frontend/lib/nine-lives/credits.ts
