# The project key is passed by .github/workflows/sonarqube.yml.

# Convex regenerates these files on every `convex dev`/`convex deploy`;
# findings in them cannot be fixed in source.
sonar.exclusions=frontend/convex/_generated/**
# Test fixtures intentionally repeat request and Convex setup patterns; do not
# treat that duplication as production-code duplication on new PRs.
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts,**/tests/**
