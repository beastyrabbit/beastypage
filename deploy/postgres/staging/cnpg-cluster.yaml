# TEMPLATE for kub-homelab: cluster/homelab/apps/webpage/beastypage-staging/
# Not applied from this repository; needs explicit approval.
# Staging holds only the scrubbed archive (#112), never raw production data.
---
apiVersion: v1
kind: Namespace
metadata:
  name: beastypage-staging
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: beastypage-staging-postgres
  namespace: beastypage-staging
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  postgresql:
    parameters:
      max_connections: "60"
      max_wal_size: "2GB"
      wal_compression: "zstd"
  managed:
    roles:
      # Deploy the release that revokes the role's privileges before merging
      # this tombstone; then delete the entry, orphaned Secrets and Infisical key.
      - name: beastypage_import
        ensure: absent
      - name: beastypage_app
        ensure: present
        login: true
        connectionLimit: 30
        passwordSecret:
          name: beastypage-staging-postgres-app-role
  storage:
    size: 20Gi
    storageClass: longhorn-single-replica
  backup:
    # Staging has one instance, so prefer-standby falls back to that primary
    # and a cold drill fences it for the duration of the snapshot.
    target: prefer-standby
    volumeSnapshot:
      className: longhorn-snapshot
      online: false
      snapshotOwnerReference: backup
  bootstrap:
    initdb:
      database: beastypage
      owner: beastypage_owner
      secret:
        name: beastypage-staging-postgres-owner
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
---
# Staging must not reach production services (Discord, production S3 bucket,
# production media/renderer). Allow DNS, the cluster's own
# database, and in-namespace traffic only; the Cilium policy below adds the
# Clerk development instance. Add the staging Quick Share bucket's endpoint
# the same way once it exists.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beastypage-staging-egress
  namespace: beastypage-staging
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector: {}
---
# Clerk has no fixed addresses, so its egress is an FQDN rule (the cluster
# runs Cilium; Kubernetes NetworkPolicy cannot match hostnames). toFQDNs only
# learns addresses from DNS answers Cilium's proxy sees, hence the DNS rule.
# Server-side Clerk calls (`currentUser()`, session verification) use the
# Backend API; the development instance's Frontend API is *.clerk.accounts.dev.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: beastypage-staging-clerk-egress
  namespace: beastypage-staging
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: ANY }
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.clerk.com
        - matchPattern: "*.clerk.accounts.dev"
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
