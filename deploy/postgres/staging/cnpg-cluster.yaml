# TEMPLATE for kub-homelab: cluster/homelab/apps/webpage/beastypage-staging/
# Not applied from this repository; needs explicit approval.
# Staging holds only the scrubbed archive (#112), never raw production data.
---
apiVersion: v1
kind: Namespace
metadata:
  name: beastypage-staging
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: beastypage-staging-postgres
  namespace: beastypage-staging
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  postgresql:
    parameters:
      max_connections: "60"
      max_wal_size: "2GB"
      wal_compression: "zstd"
  managed:
    roles:
      - name: beastypage_import
        ensure: present
        login: true
        connectionLimit: 4
        passwordSecret:
          name: beastypage-staging-postgres-import-role
      - name: beastypage_app
        ensure: present
        login: true
        connectionLimit: 30
        passwordSecret:
          name: beastypage-staging-postgres-app-role
  storage:
    size: 20Gi
    storageClass: longhorn-single-replica
  backup:
    volumeSnapshot:
      className: longhorn-snapshot
      online: true
      snapshotOwnerReference: backup
  bootstrap:
    initdb:
      database: beastypage
      owner: beastypage_owner
      secret:
        name: beastypage-staging-postgres-owner
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
---
# Staging must not reach production services (Convex, Discord, production
# S3 bucket, production media/renderer). Allow DNS, the cluster's own
# database, and in-namespace traffic only; add explicit egress for the
# Clerk development instance.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beastypage-staging-egress
  namespace: beastypage-staging
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector: {}
