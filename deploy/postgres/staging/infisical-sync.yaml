# TEMPLATE for kub-homelab: cluster/homelab/apps/webpage/beastypage-staging/
# Staging values live only in Infisical's staging environment. These targets
# are used by the dump restore, scrub verification and staging frontend.
# Required key names (never values in Git):
#   BEASTYPAGE_DB_OWNER_USERNAME, BEASTYPAGE_DB_OWNER_PASSWORD
#   BEASTYPAGE_DB_APP_PASSWORD, BEASTYPAGE_DB_IMPORT_PASSWORD
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: beastypage-staging-postgres-secrets
  namespace: beastypage-staging
spec:
  infisicalAuthRef:
    name: kub-homelab-operator
    namespace: tools
  sources:
    - projectId: 71562e7f-98e6-45f1-a031-ca8713b3f0dd
      environmentSlug: staging
      secretPath: /kubernetes/beastypage-staging/postgres
      recursive: false
  targets:
    - name: beastypage-staging-postgres-owner
      namespace: beastypage-staging
      kind: Secret # gitleaks:allow - values are rendered from Infisical
      creationPolicy: Orphan
      secretType: kubernetes.io/basic-auth
      template:
        engineVersion: v1
        data:
          username: "{{ .BEASTYPAGE_DB_OWNER_USERNAME.Value }}"
          password: "{{ .BEASTYPAGE_DB_OWNER_PASSWORD.Value }}"
    - name: beastypage-staging-postgres-app-role
      namespace: beastypage-staging
      kind: Secret # gitleaks:allow - values are rendered from Infisical
      creationPolicy: Orphan
      secretType: kubernetes.io/basic-auth
      template:
        engineVersion: v1
        data:
          username: beastypage_app
          password: "{{ .BEASTYPAGE_DB_APP_PASSWORD.Value }}"
    - name: beastypage-staging-postgres-import-role
      namespace: beastypage-staging
      kind: Secret # gitleaks:allow - values are rendered from Infisical
      creationPolicy: Orphan
      secretType: kubernetes.io/basic-auth
      template:
        engineVersion: v1
        data:
          username: beastypage_import
          password: "{{ .BEASTYPAGE_DB_IMPORT_PASSWORD.Value }}"
    - name: beastypage-staging-postgres-urls
      namespace: beastypage-staging
      kind: Secret # gitleaks:allow - values are rendered from Infisical
      creationPolicy: Orphan
      secretType: Opaque
      template:
        engineVersion: v1
        data:
          DATABASE_URL: "postgresql://beastypage_app:{{ .BEASTYPAGE_DB_APP_PASSWORD.Value | urlquery }}@beastypage-staging-postgres-rw.beastypage-staging.svc:5432/beastypage?sslmode=verify-full&sslrootcert=/etc/postgres-ca/ca.crt"
          DATABASE_MIGRATION_URL: "postgresql://{{ .BEASTYPAGE_DB_OWNER_USERNAME.Value }}:{{ .BEASTYPAGE_DB_OWNER_PASSWORD.Value | urlquery }}@beastypage-staging-postgres-rw.beastypage-staging.svc:5432/beastypage?sslmode=verify-full&sslrootcert=/etc/postgres-ca/ca.crt"
          DATABASE_IMPORT_URL: "postgresql://beastypage_import:{{ .BEASTYPAGE_DB_IMPORT_PASSWORD.Value | urlquery }}@beastypage-staging-postgres-rw.beastypage-staging.svc:5432/beastypage?sslmode=verify-full&sslrootcert=/etc/postgres-ca/ca.crt"
  syncOptions:
    refreshInterval: 5m
