name: Build and Push Container Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_frontend:
        description: "Build frontend image"
        type: boolean
        default: true
      build_renderer:
        description: "Build renderer service image"
        type: boolean
        default: true
      build_image_processing:
        description: "Build image processing service image"
        type: boolean
        default: true
      build_media:
        description: "Build Quick Share media service image"
        type: boolean
        default: true
      build_discord_bot:
        description: "Build Discord bot image"
        type: boolean
        default: true
      publish_images:
        description: "Publish selected images to GHCR"
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

concurrency:
  group: beastypage-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publishing reuses the pull request's validate.yml result instead of
  # re-running the source checks, but only with proof that it tested this exact
  # tree (.github/scripts/release_gate.py). Every build job requires this job's
  # success. Manual builds that publish nothing need no proof.
  release-gate:
    runs-on: arc-beastypage
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      PUBLISHING: ${{ github.event_name == 'push' || inputs.publish_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.PUBLISHING == 'true'

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: env.PUBLISHING == 'true'

      - name: Require a passing validate.yml run for this tree
        if: env.PUBLISHING == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          uv run --no-project --python 3.13 .github/scripts/release_gate.py \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --tree "$tree"

  build-frontend:
    needs: release-gate
    if: |
      needs.release-gate.result == 'success' &&
      (github.event_name == 'push' || inputs.build_frontend)
    runs-on: arc-beastypage
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read cat-system catalog hash
        id: cat-system
        run: echo "hash=$(cat frontend/public/cat-system/catalog-hash.txt)" >> "$GITHUB_OUTPUT"

      - name: Fetch frontend build settings from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}
          domain: "http://192.168.60.11:8080"
          project-slug: beastypage
          env-slug: prod
          secret-path: /ci

      - name: Verify frontend build settings
        env:
          TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          : "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Missing NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY from Infisical prod /ci}"
          if [ "$TAG_BUILD" = "true" ]; then
            : "${NEXT_PUBLIC_UMAMI_HOST:?Missing NEXT_PUBLIC_UMAMI_HOST from Infisical prod /ci}"
            : "${NEXT_PUBLIC_UMAMI_WEBSITE_ID:?Missing NEXT_PUBLIC_UMAMI_WEBSITE_ID from Infisical prod /ci}"
            : "${NEXT_PUBLIC_UMAMI_DOMAINS:?Missing NEXT_PUBLIC_UMAMI_DOMAINS from Infisical prod /ci}"
            : "${NEXT_PUBLIC_GLITCHTIP_DSN:?Missing NEXT_PUBLIC_GLITCHTIP_DSN from Infisical prod /ci}"
            : "${SENTRY_AUTH_TOKEN:?Missing SENTRY_AUTH_TOKEN from Infisical prod /ci}"
          fi

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/beastypage-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' }}
            type=raw,value=smoke-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            dev.beastypage.cat-system.catalog-hash=${{ steps.cat-system.outputs.hash }}
          build-args: |
            NEXT_PUBLIC_UMAMI_HOST=${{ env.NEXT_PUBLIC_UMAMI_HOST }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ env.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_UMAMI_DOMAINS=${{ env.NEXT_PUBLIC_UMAMI_DOMAINS }}
            NEXT_PUBLIC_GLITCHTIP_DSN=${{ env.NEXT_PUBLIC_GLITCHTIP_DSN }}
            NEXT_PUBLIC_APP_ENV=${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'ci' }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
            CAT_SYSTEM_CATALOG_HASH=${{ steps.cat-system.outputs.hash }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ startsWith(github.ref, 'refs/tags/v') && env.SENTRY_AUTH_TOKEN || '' }}

  build-renderer:
    needs: release-gate
    if: |
      needs.release-gate.result == 'success' &&
      (github.event_name == 'push' || inputs.build_renderer)
    runs-on: arc-beastypage
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read cat-system catalog hash
        id: cat-system
        run: echo "hash=$(cat frontend/public/cat-system/catalog-hash.txt)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/beastypage-renderer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' }}
            type=raw,value=smoke-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build renderer image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./backend/renderer_service/Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            dev.beastypage.cat-system.catalog-hash=${{ steps.cat-system.outputs.hash }}
          build-args: |
            CAT_SYSTEM_CATALOG_HASH=${{ steps.cat-system.outputs.hash }}
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

  build-image-processing:
    needs: release-gate
    if: |
      needs.release-gate.result == 'success' &&
      (github.event_name == 'push' || inputs.build_image_processing)
    runs-on: arc-beastypage
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/beastypage-image-processing
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' }}
            type=raw,value=smoke-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build image-processing image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend/image_processing_service
          file: ./backend/image_processing_service/Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_images }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

  build-discord-bot:
    needs: release-gate
    if: |
      needs.release-gate.result == 'success' &&
      (github.event_name == 'push' || inputs.build_discord_bot)
    runs-on: arc-beastypage
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read cat-system catalog hash
        id: cat-system
        run: echo "hash=$(cat frontend/public/cat-system/catalog-hash.txt)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/beastypage-discord-bot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' }}
            type=raw,value=smoke-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build Discord bot image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend/discord-bot
          file: ./backend/discord-bot/Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            dev.beastypage.cat-system.catalog-hash=${{ steps.cat-system.outputs.hash }}
          build-args: |
            CAT_SYSTEM_CATALOG_HASH=${{ steps.cat-system.outputs.hash }}
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

  build-media:
    needs: release-gate
    if: |
      needs.release-gate.result == 'success' &&
      (github.event_name == 'push' || inputs.build_media)
    runs-on: arc-beastypage
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.publish_images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/beastypage-media
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' }}
            type=raw,value=smoke-${{ github.run_id }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build media image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend/media_service
          file: ./backend/media_service/Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_images }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

  # Flux image automation rolls a tag out without this workflow: image scans
  # every 2 minutes, a 1-minute Git sync, then a HelmRelease upgrade with a
  # 15-minute timeout (kub-homelab cluster/homelab/infra/image-automation).
  # Only the frontend reports its version; the other services can roll later.
  deploy-smoke:
    needs:
      - build-frontend
      - build-renderer
      - build-image-processing
      - build-discord-bot
      - build-media
    if: github.event_name == 'push'
    runs-on: arc-beastypage
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Wait for this release on the live site and check its health
        run: |
          uv run --no-project --python 3.13 .github/scripts/release_smoke.py \
            --base-url https://beastyrabbit.com \
            --expected "$GITHUB_REF_NAME" \
            --timeout-seconds 1800
