name: Validate pull request
on:
  pull_request:
  # Release recovery: validate the exact tagged commit when the PR proof does not cover it.
  workflow_dispatch:
permissions:
  contents: read
# Cancel runs superseded by a newer push to the same PR; push, tag and manual runs keep separate groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  applications:
    runs-on: arc-beastypage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # A PR run tests the merge ref, not the PR head. The release gate in
      # build-images.yml compares this tree with the tagged commit's tree.
      - name: Record tested tree
        id: tree
        run: |
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/validated-tree"
          echo "tree=$(cat "$RUNNER_TEMP/validated-tree")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/validated-tree
          if-no-files-found: error
          retention-days: 90
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install dependencies
        run: |
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
          pnpm --dir backend/media_service install --frozen-lockfile --ignore-scripts
          pnpm --dir backend/image_processing_service install --frozen-lockfile --ignore-scripts
          npm --prefix backend/discord-bot ci --ignore-scripts
          uv sync --project backend/renderer_service --extra dev --frozen
      - run: pnpm cat-system:build
      - run: pnpm media:check
      - run: pnpm image-processing:check
      - run: pnpm --dir frontend run lint
      - name: Check first-party Python
        run: |
          uv run --project backend/renderer_service --frozen --extra dev ruff check backend/renderer_service/renderer_service backend/renderer_service/tests
          uv run --project backend/renderer_service --frozen --extra dev ruff format --check backend/renderer_service/renderer_service backend/renderer_service/tests
      - name: Check browser behavior with local fixtures
        run: |
          pnpm --dir frontend exec playwright install --with-deps chromium
          pnpm --dir frontend exec playwright test
      - name: Check built-app telemetry with local collectors
        timeout-minutes: 8
        run: pnpm --dir frontend run test:telemetry

  # PostgreSQL migration foundation (docs/migration/adr-0001-postgresql.md).
  # Ephemeral database; nothing here touches production data.
  database:
    runs-on: arc-beastypage
    env:
      DATABASE_URL: postgresql://beastypage:beastypage@127.0.0.1:5432/beastypage
      DATABASE_APP_ROLE: beastypage_app
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: beastypage
          POSTGRES_USER: beastypage
          POSTGRES_PASSWORD: beastypage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beastypage -d beastypage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - name: Provision migration role fixture
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          await client.query("create role beastypage_app login password 'beastypage'");
          await client.end();
          NODE
      - name: Schema matches committed migrations
        run: pnpm --dir frontend run db:drift
      - name: Apply migrations to an empty database
        run: pnpm --dir frontend run db:migrate
      - name: Re-applying migrations is a no-op
        run: pnpm --dir frontend run db:migrate
      - name: Schema version is compatible
        run: pnpm --dir frontend run db:migrate --status
      - name: Database tests
        run: pnpm --dir frontend run test:db
