pre-commit:
  commands:
    gitleaks:
      run: gitleaks git --staged --no-banner
      fail_text: "Secrets detected! Remove before committing."
    ruff-lint:
      glob: "backend/**/*.py"
      run: ruff check --fix {staged_files}
    ruff-format:
      glob: "backend/**/*.py"
      run: ruff format {staged_files}
    tsc:
      glob: "frontend/**/*.{ts,tsx}"
      run: cd frontend && pnpm exec tsc --noEmit
    tsc-discord-bot:
      glob: "backend/discord-bot/**/*.ts"
      run: cd backend/discord-bot && npx tsc --noEmit
    tsc-media-service:
      glob: "backend/media_service/**/*.ts"
      run: cd backend/media_service && pnpm run typecheck
    lint-media-service:
      glob: "backend/media_service/**/*.{ts,json}"
      run: cd backend/media_service && pnpm run lint
