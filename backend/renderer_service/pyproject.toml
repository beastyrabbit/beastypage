[project]
name = "renderer-service"
version = "1.3.3"
description = "FastAPI service that wraps the Lifegen sprite renderer for CatGenerator V3"
authors = [{name = "BeastyRabbit Tools", email = "devnull@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.2",
  "uvicorn[standard]>=0.30.6",
  "pillow>=12.3.0",
  "numpy>=2.1.2",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.0",
  "pygame>=2.5.2",
  "cairosvg>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff==0.16.4",
    "httpx2>=2.12.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["renderer_service*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP006", "UP035", "UP045", "RUF022"]
